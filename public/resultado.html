<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Resultado – Melhores de 2026</title>
<style>
:root{--bg:#edf1ea;--surface:#fff;--ink:#16211a;--muted:#5a6a5e;--line:#d3ddd1;--field:#1d6a3a;--gold:#c9a019;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1611;--surface:#17211a;--ink:#e6eee7;--muted:#9bab9e;--line:#2b3a2f;--field:#2fb36a;--gold:#e2bd3a;--danger:#ff8a80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 12px}h2{font-size:1.1rem;margin:0 0 8px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
input,button{font:inherit}input{border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;max-width:260px;background:var(--bg);color:var(--ink)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--field);color:#fff;font-weight:700;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;margin:4px 0}.row .nm{width:150px;flex:none;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:18px;background:var(--gold);border-radius:4px;min-width:2px}.row .q{font-weight:700;font-size:.9rem}
.top1 .nm{font-weight:800}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.x{background:none;color:var(--danger);padding:2px 6px}
.muted{color:var(--muted);font-size:.85rem}.err{color:var(--danger)}
</style></head><body><div class="wrap">
<h1>🏆 Resultado – Melhores de 2026</h1>
<div class="box" id="login"><label>Senha<br><input id="senha" type="password" autocomplete="current-password"></label> <button id="entrar">Ver resultado</button> <span id="msg" class="err"></span></div>
<div id="out"></div>
</div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let SENHA='';try{SENHA=sessionStorage.getItem('res-senha')||''}catch{}
async function carregar(){
  const r=await fetch('/api/resultado',{headers:{'x-senha':SENHA}});const j=await r.json().catch(()=>({erro:'Erro no servidor.'}));
  if(!r.ok){document.getElementById('msg').textContent=j.erro;document.getElementById('login').hidden=false;return}
  try{sessionStorage.setItem('res-senha',SENHA)}catch{}
  document.getElementById('login').hidden=true;
  const cats=Object.fromEntries(j.placar.map(p=>[p.k,p.t]));
  document.getElementById('out').innerHTML=`<p class="muted">${j.total} eleitor(es) · <a href="#" id="atual">atualizar</a></p>`+
   j.placar.map(p=>{const max=p.ranking[0]?.[1]||1;
     return `<div class="box"><h2>${esc(p.t)}</h2>${p.ranking.length?p.ranking.map(([n,q],i)=>`<div class="row ${i<p.n?'top1':''}"><span class="nm">${esc(n)}</span><span class="bar" style="width:${Math.round(q/max*55)}%"></span><span class="q">${q}</span></div>`).join(''):'<span class="muted">Sem votos ainda.</span>'}</div>`}).join('')+
   `<div class="box"><h2>Quem votou</h2><table><tr><th>Nome</th><th>Votos</th><th></th></tr>${j.eleitores.map(e=>`<tr><td>${esc(e.nome)}<br><span class="muted">${new Date(e.ts).toLocaleString('pt-BR')}</span></td><td>${Object.entries(e.votos).map(([k,v])=>`<b>${esc(cats[k]||k)}:</b> ${v.map(esc).join(', ')}`).join('<br>')}</td><td><button class="x" data-id="${esc(e.id)}" data-n="${esc(e.nome)}" title="Apagar voto">✕</button></td></tr>`).join('')}</table><p class="muted">O ✕ apaga o voto (ex.: nome falso ou repetido). A pessoa pode votar de novo.</p></div>`;
}
document.getElementById('entrar').onclick=()=>{SENHA=document.getElementById('senha').value;document.getElementById('msg').textContent='';carregar()};
document.getElementById('senha').onkeydown=e=>{if(e.key==='Enter')document.getElementById('entrar').click()};
document.addEventListener('click',async e=>{
  if(e.target.id==='atual'){e.preventDefault();carregar();return}
  const b=e.target.closest('.x');if(!b)return;
  if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent='Apagar?';setTimeout(()=>{b.dataset.confirm='';b.textContent='✕'},3000);return}
  await fetch('/api/resultado?id='+encodeURIComponent(b.dataset.id),{method:'DELETE',headers:{'x-senha':SENHA}});carregar()});
if(SENHA)carregar();
</script></body></html>
